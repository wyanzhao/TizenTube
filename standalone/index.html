<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TizenTube</title>
</head>
<body style="background:#151515;color:white;font:30px sans-serif;padding:60px">
  <p id="state">Starting player...</p>
  <script>
    var service = tizen.application.getCurrentApplication().appInfo.packageId + '.StandaloneService';
    tizen.application.launch(
      service,
      function () {
        document.getElementById('state').textContent =
          'The player did not start. Check that this TV was provisioned (see README).';
      },
      function () {
        document.getElementById('state').textContent = 'Could not start the player service.';
      }
    );
  </script>
</body>
</html>
