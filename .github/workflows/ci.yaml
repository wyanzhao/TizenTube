name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install userscript dependencies (lockfile, no lifecycle scripts)
        run: npm ci --ignore-scripts --prefix mods
      - name: Build, pin userscript hash, run tests, stage widget members
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-widget-members
          path: build/
